[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jianpu-score"
version = "0.1.0"
description = "Local audio-to-jianpu conversion service"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.6",
  "python-multipart==0.0.20",
  "librosa==0.10.2.post1",
  "soundfile==0.13.1",
  "numpy==2.0.2",
  "scipy==1.14.1",
  "mido==1.3.3",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
